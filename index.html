<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shawzen Online</title>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f1115;
      color: #f3f4f6;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      gap: 12px;
    }
    .hud {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: center;
      background: #181b22;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid #2a2f3a;
    }
    input, button {
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #343b48;
      font-size: 14px;
    }
    input {
      background: #0f1115;
      color: #fff;
      width: 150px;
    }
    button {
      background: #2563eb;
      color: #fff;
      cursor: pointer;
      border: none;
      font-weight: 600;
    }
    button:hover { background: #1d4ed8; }
    #status { font-size: 13px; color: #9ca3af; }
    canvas {
      background: #141820;
      border: 2px solid #2a2f3a;
      border-radius: 12px;
      max-width: 100%;
    }
  </style>
</head>
<body>
  <div class="hud">
    <input id="roomInput" type="text" maxlength="16" placeholder="رمز الغرفة" />
    <button id="joinBtn" type="button">دخول الغرفة</button>
    <span id="status">غير متصل</span>
  </div>

  <canvas id="gameCanvas" width="900" height="540"></canvas>

  <script>
    const SERVER_URL = "https://shawzen-online-server.onrender.com";
    const socket = io(SERVER_URL, {
      transports: ["websocket", "polling"]
    });

    const roomInput = document.getElementById("roomInput");
    const joinBtn = document.getElementById("joinBtn");
    const statusEl = document.getElementById("status");
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let currentRoom = null;
    const players = {};
    const keys = {};

    const selfPlayer = {
      id: null,
      x: 450,
      y: 270,
      speed: 4,
      radius: 16,
      color: "#38bdf8"
    };

    socket.on("connect", () => {
      selfPlayer.id = socket.id;
      statusEl.textContent = "متصل بالسيرفر";
    });

    socket.on("disconnect", () => {
      statusEl.textContent = "انقطع الاتصال";
    });

    joinBtn.addEventListener("click", () => {
      const code = roomInput.value.trim();
      if (!code) return;
      currentRoom = code;
      socket.emit("join_room", { room: currentRoom });
      statusEl.textContent = "الغرفة: " + currentRoom;
    });

    socket.on("room_state", (state) => {
      if (!state || typeof state !== "object") return;
      Object.keys(players).forEach((id) => {
        if (id !== socket.id) delete players[id];
      });
      for (const [id, p] of Object.entries(state)) {
        if (id !== socket.id && p && typeof p.x === "number" && typeof p.y === "number") {
          players[id] = {
            x: Math.max(20, Math.min(canvas.width - 20, p.x)),
            y: Math.max(20, Math.min(canvas.height - 20, p.y)),
            color: "#f97316"
          };
        }
      }
    });

    socket.on("player_left", (id) => {
      if (id && players[id]) delete players[id];
    });

    window.addEventListener("keydown", (e) => { keys[e.key.toLowerCase()] = true; });
    window.addEventListener("keyup", (e) => { keys[e.key.toLowerCase()] = false; });

    function update() {
      let moved = false;
      if (keys["w"] || keys["arrowup"]) { selfPlayer.y -= selfPlayer.speed; moved = true; }
      if (keys["s"] || keys["arrowdown"]) { selfPlayer.y += selfPlayer.speed; moved = true; }
      if (keys["a"] || keys["arrowleft"]) { selfPlayer.x -= selfPlayer.speed; moved = true; }
      if (keys["d"] || keys["arrowright"]) { selfPlayer.x += selfPlayer.speed; moved = true; }

      selfPlayer.x = Math.max(selfPlayer.radius, Math.min(canvas.width - selfPlayer.radius, selfPlayer.x));
      selfPlayer.y = Math.max(selfPlayer.radius, Math.min(canvas.height - selfPlayer.radius, selfPlayer.y));

      if (moved && currentRoom && socket.connected) {
        socket.emit("player_move", {
          room: currentRoom,
          x: selfPlayer.x,
          y: selfPlayer.y
        });
      }
    }

    function drawPlayer(p, radius = 16) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.fill();
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (const p of Object.values(players)) {
        drawPlayer(p);
      }
      drawPlayer(selfPlayer, selfPlayer.radius);
    }

    function loop() {
      update();
      render();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
